<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integralrechnung – Mathematik</title>
  <link rel="stylesheet" href="../../styles.css">
</head>
<body class="app-module">
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-title" href="../../index.html">Mathematik</a>
      <a class="back-link" href="../../index.html">Übersicht</a>
    </div>
  </header>

  <main class="module-shell">
    <div class="module-heading">
      <span class="module-category">Analysis</span>
      <h1>Integralrechnung</h1>
    </div>

    <section class="lab-card integral-lab" aria-label="Interaktive Integralrechnung">
      <div class="lab-tools">
        <div class="tool-group">
          <span class="tool-label">Geschwindigkeit</span>
          <div class="choice-row" id="exampleChoices">
            <button type="button" class="choice is-selected" data-example="constant">Konstant</button>
            <button type="button" class="choice" data-example="accelerating">Beschleunigt</button>
            <button type="button" class="choice" data-example="turning">Richtungswechsel</button>
          </div>
        </div>

        <div class="tool-group">
          <span class="tool-label">Schrittweite</span>
          <div class="choice-row" id="stepChoices">
            <button type="button" class="choice" data-step="1">1 s</button>
            <button type="button" class="choice is-selected" data-step="0.5">0,5 s</button>
            <button type="button" class="choice" data-step="0.1">0,1 s</button>
          </div>
        </div>
      </div>

      <div class="equation-card" id="equation"></div>
      <canvas id="integralCanvas" width="900" height="560"></canvas>

      <div class="control-row integral-controls">
        <button type="button" onclick="resetSimulation()">Zurücksetzen</button>
        <button type="button" onclick="stepForward()">Ein Schritt</button>
        <button type="button" onclick="toggleSimulation()" id="playButton">Start</button>
      </div>

      <div class="info-panel metric-grid" id="metrics"></div>
    </section>
  </main>

  <footer class="site-footer">
    Sebastian Schlütter · Hochschule Mainz
  </footer>

  <script src="app.js"></script>
</body>
</html>
