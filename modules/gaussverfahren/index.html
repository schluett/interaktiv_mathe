<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaußverfahren – Mathematik</title>
  <link rel="stylesheet" href="../../styles.css">
</head>
<body class="app-module">
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-title" href="../../index.html">Mathematik</a>
      <a class="back-link" href="../../index.html">Übersicht</a>
    </div>
  </header>

  <main class="module-shell">
    <div class="module-heading">
      <span class="module-category">Lineare Algebra</span>
      <h1>Gaußverfahren</h1>
    </div>

    <section class="lab-card gauss-quiz" aria-label="Interaktive Übung zum Gaußverfahren">
      <div class="gauss-quiz-toolbar">
        <div class="gauss-view-switch" role="group" aria-label="Darstellung wählen">
          <button type="button" class="view-button is-selected" id="equationViewButton">Gleichungssystem</button>
          <button type="button" class="view-button" id="matrixViewButton">Matrixform</button>
        </div>
        <button type="button" class="gauss-reset-button" id="restartButton">Neu starten</button>
      </div>

      <div class="gauss-quiz-status" id="statusLine" aria-live="polite"></div>
      <div class="gauss-quiz-stage" id="gaussStage" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    Sebastian Schlütter · Hochschule Mainz
  </footer>

  <script src="app.js"></script>
</body>
</html>
